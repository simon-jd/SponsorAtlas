sponsoratlas:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('SPONSORATLAS_DUCKDB_PATH', '.tools/staging/sponsoratlas.duckdb') }}"
      schema: STAGING
      threads: 1
      settings:
        memory_limit: 4GB
        max_temp_directory_size: 2GB
        preserve_insertion_order: false
        threads: 1
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: DBT_SVC
      role: TRANSFORMER
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      database: ANALYTICS
      schema: STAGING
      warehouse: SPONSORATLAS_XS
      threads: 2
      client_session_keep_alive: false
      connect_retries: 0
      connect_timeout: 15
      query_tag: sponsoratlas_task3
