[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsoratlas"
version = "0.1.0"
description = "Traceable data platform for US H-1B sponsorship (DOL LCA and USCIS data)"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "python-hcl2>=7,<9"]
snowflake = ["snowflake-connector-python>=4,<5"]
ingestion = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "airbyte-cdk==7.39.1",
  "psycopg[binary]>=3.2,<4",
]
staging = [
  "dbt-core==1.12.6",
  "dbt-snowflake==1.12.4",
  "dbt-duckdb==1.11.0",
]
er = [
    "splink==5.0.0",
]
er-spark = [
    "pyspark-client==4.2.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
  "warehouse/tests", "scripts/tests", "er/tests", "governance/tests", "bi/tests",
  "azure/tests", "semantic/tests", "web/scripts/tests",
]
pythonpath = ["."]
markers = ["snowflake: requires explicit opt-in and Snowflake key-pair credentials", "integration: requires an external service"]
# importlib mode: several suites share test file basenames (e.g. test_pipeline.py).
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/archive", "docs/evidence", "**/evidence", ".tools"]

[tool.ruff.lint]
# Pin the rule set; newer ruff releases widen the default selection.
select = ["E4", "E7", "E9", "F"]
# azure/fabric is deliberately written as dense one-liners; tests and the
# Databricks notebook import after sys.path setup.
ignore = ["E701", "E702", "E402", "E731", "E741"]
