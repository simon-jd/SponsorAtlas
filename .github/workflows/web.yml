name: Web quality (portable fixture)
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # No public LHCI upload, cloud credentials, source DB, or browser install.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check browser availability and install locked dependencies
        run: |
          test -x /usr/bin/google-chrome
          bash web/scripts/bootstrap.sh
      # Exact browser, font, and fontconfig equality is checked by quality-ci.sh before quality work.
      - name: Run production-route quality entry point
        run: bash web/scripts/quality-ci.sh
      - name: Retain private repository test artifacts (seven days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-quality
          retention-days: 7
          path: |
            web/apps/site/evidence/quality-*
            web/apps/site/test-results
